<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Travel Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --navy: #0f1f3d;
  --blue: #1d4ed8;
  --sky: #38bdf8;
  --gold: #f59e0b;
  --cream: #fefce8;
  --light: #f0f4ff;
  --border: #dce4f5;
  --text: #1e293b;
  --muted: #64748b;
  --white: #ffffff;
  --card-bg: rgba(255,255,255,0.92);
  --shadow: 0 8px 32px rgba(15,31,61,0.10);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'DM Sans', sans-serif;
  background: linear-gradient(135deg, #e8eeff 0%, #f8fbff 60%, #fffbe8 100%);
  min-height: 100vh;
  color: var(--text);
}

/* ─── HEADER ─── */
header {
  background: var(--navy);
  color: #fff;
  text-align: center;
  padding: 36px 20px 28px;
  position: relative;
  overflow: hidden;
}
header::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 70% 50%, rgba(56,189,248,0.18) 0%, transparent 70%);
}
header h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.8rem, 5vw, 3rem);
  font-weight: 900;
  letter-spacing: -1px;
  position: relative;
}
header h1 span { color: var(--sky); }
header p {
  margin-top: 8px;
  color: rgba(255,255,255,0.6);
  font-weight: 300;
  font-size: 1rem;
  position: relative;
}

/* ─── LAYOUT ─── */
.container { max-width: 1080px; margin: auto; padding: 28px 20px 80px; }

.card {
  background: var(--card-bg);
  backdrop-filter: blur(12px);
  border-radius: 20px;
  padding: 24px;
  margin: 20px 0;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  transition: transform 0.25s, box-shadow 0.25s;
}
.card:hover { transform: translateY(-3px); box-shadow: 0 14px 40px rgba(15,31,61,0.13); }

/* ─── SECTION TITLES ─── */
.section-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.35rem;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.section-title span { font-size: 1.3rem; }

/* ─── FORM ─── */
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
@media(max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }

.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 0.78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

input, select {
  padding: 12px 14px;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  outline: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.97rem;
  color: var(--text);
  background: #fff;
  transition: border-color 0.2s, box-shadow 0.2s;
}
input:focus, select:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(29,78,216,0.10);
}
input.error, select.error { border-color: #ef4444; }
.field-error { font-size: 0.78rem; color: #ef4444; min-height: 18px; }

/* ─── BUDGET SELECTOR ─── */
.budget-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 4px;
}
.budget-btn {
  padding: 11px;
  border: 2px solid var(--border);
  background: #fff;
  cursor: pointer;
  border-radius: 12px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 600;
  font-size: 0.95rem;
  color: var(--muted);
  transition: 0.2s;
}
.budget-btn:hover { border-color: var(--blue); color: var(--blue); background: var(--light); }
.budget-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }

/* ─── BUTTONS ─── */
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.btn {
  padding: 12px 22px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-weight: 600;
  font-size: 0.95rem;
  transition: transform 0.2s, box-shadow 0.2s;
}
.btn-primary { background: var(--navy); color: #fff; }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(15,31,61,0.25); }
.btn-secondary { background: var(--light); color: var(--navy); border: 1.5px solid var(--border); }
.btn-secondary:hover { background: var(--border); }
.btn-ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--border); }
.btn-ghost:hover { background: #f1f5f9; color: var(--text); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none !important; }

/* ─── LOADER ─── */
.loader-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 40px; }
.loader {
  width: 44px; height: 44px;
  border: 4px solid var(--border);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loader-text { color: var(--muted); font-size: 0.95rem; }

/* ─── AI STATUS ─── */
.ai-status {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px;
  background: linear-gradient(135deg, #eff6ff, #f0fdf4);
  border-radius: 10px;
  font-size: 0.88rem;
  color: var(--blue);
  margin-bottom: 16px;
  border: 1px solid #bfdbfe;
}
.ai-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #22c55e;
  animation: pulse 1.5s infinite;
  flex-shrink: 0;
}
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.3)} }

/* ─── WEATHER CARD ─── */
.weather-card {
  background: linear-gradient(135deg, var(--navy) 0%, #1e3a8a 100%);
  color: #fff;
  border-radius: 20px;
  padding: 24px;
  margin: 20px 0;
  box-shadow: var(--shadow);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  align-items: center;
}
@media(max-width:500px){ .weather-card { grid-template-columns: 1fr; } }
.weather-main { display: flex; flex-direction: column; gap: 4px; }
.weather-icon { font-size: 3rem; line-height: 1; }
.weather-temp { font-family: 'Playfair Display', serif; font-size: 2.5rem; font-weight: 900; }
.weather-desc { color: rgba(255,255,255,0.7); font-size: 0.95rem; text-transform: capitalize; }
.weather-location { font-size: 0.85rem; color: rgba(255,255,255,0.5); margin-top: 4px; }
.weather-details { display: flex; flex-direction: column; gap: 10px; }
.weather-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: rgba(255,255,255,0.08); border-radius: 10px; font-size: 0.88rem; }
.weather-row span:first-child { color: rgba(255,255,255,0.6); }
.weather-row span:last-child { font-weight: 600; }
.weather-tip { grid-column: 1/-1; background: rgba(245,158,11,0.15); border: 1px solid rgba(245,158,11,0.3); border-radius: 10px; padding: 10px 14px; font-size: 0.85rem; color: #fcd34d; }

/* ─── COST CARD ─── */
.cost-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-top: 4px; }
.cost-item { background: var(--light); border-radius: 12px; padding: 14px; text-align: center; }
.cost-item .cost-val { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; color: var(--navy); }
.cost-item .cost-label { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
.cost-total { margin-top: 14px; padding: 14px; background: var(--navy); border-radius: 12px; color: #fff; display: flex; justify-content: space-between; align-items: center; }
.cost-total .label { font-size: 0.9rem; color: rgba(255,255,255,0.7); }
.cost-total .amount { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; }

/* ─── PLACES GRID ─── */
.places-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
.place-card {
  border-radius: 14px; overflow: hidden;
  border: 1px solid var(--border);
  background: #fff;
  transition: transform 0.2s, box-shadow 0.2s;
  cursor: default;
}
.place-card:hover { transform: translateY(-4px); box-shadow: 0 10px 28px rgba(15,31,61,0.12); }
.place-card img { width: 100%; height: 130px; object-fit: cover; display: block; }
.place-card .place-name { padding: 10px 12px; font-size: 0.88rem; font-weight: 600; color: var(--navy); }

/* ─── ITINERARY ─── */
.itinerary-ai { white-space: pre-wrap; line-height: 1.75; font-size: 0.95rem; color: var(--text); }
.day-block { margin-bottom: 22px; padding-bottom: 22px; border-bottom: 1px solid var(--border); }
.day-block:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.day-header {
  font-family: 'Playfair Display', serif;
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 8px;
  display: flex; align-items: center; gap: 10px;
}
.day-badge {
  background: var(--navy); color: #fff;
  border-radius: 20px; padding: 3px 12px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.78rem; font-weight: 600;
}
.day-content p { margin: 6px 0; font-size: 0.93rem; }
.day-content p strong { color: var(--blue); }

/* ─── BOOKING ─── */
.booking-section { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.booking-cat h3 { font-size: 0.85rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
.booking-links { display: flex; flex-direction: column; gap: 6px; }
.booking-link {
  padding: 9px 14px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: #fff;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  color: var(--text);
  transition: 0.2s;
  text-align: left;
}
.booking-link:hover { border-color: var(--blue); color: var(--blue); background: var(--light); }

/* ─── MAP ─── */
.map-frame { border-radius: 14px; overflow: hidden; border: 1px solid var(--border); }
.map-frame iframe { display: block; width: 100%; height: 300px; }

/* ─── PACKING LIST ─── */
.packing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; }
.pack-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px;
  background: var(--light); border-radius: 10px;
  font-size: 0.88rem;
}
.pack-item input[type=checkbox] { accent-color: var(--blue); width: 15px; height: 15px; cursor: pointer; flex-shrink: 0; }

/* ─── TRIP HEADER ─── */
.trip-header {
  background: linear-gradient(135deg, var(--navy), #1e40af);
  color: #fff; border-radius: 20px;
  padding: 24px 28px;
  margin-bottom: 4px;
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
}
.trip-title { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 700; }
.trip-meta { display: flex; gap: 10px; flex-wrap: wrap; }
.trip-tag {
  background: rgba(255,255,255,0.15); border-radius: 20px;
  padding: 5px 14px; font-size: 0.82rem; font-weight: 600;
}

/* ─── CHATBOT ─── */
#chatbot {
  position: fixed; bottom: 20px; right: 20px;
  width: min(300px, calc(100vw - 32px));
  font-size: 14px; z-index: 999;
  border-radius: 16px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.18);
  overflow: hidden;
}
#chat-toggle {
  background: var(--navy); color: #fff;
  padding: 13px 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: space-between;
  font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 0.9rem;
}
#chat-toggle .chevron { transition: transform 0.3s; }
#chatbot.open #chat-toggle .chevron { transform: rotate(180deg); }
#chat-body {
  display: none; background: #fff;
  border: 1px solid var(--border); border-top: none;
  border-radius: 0 0 16px 16px;
}
#chatbot.open #chat-body { display: block; }
#chat-messages {
  height: 220px; overflow-y: auto; padding: 12px;
  display: flex; flex-direction: column; gap: 8px;
}
.chat-msg { display: flex; }
.chat-msg.user { justify-content: flex-end; }
.chat-bubble {
  max-width: 80%; padding: 8px 12px;
  border-radius: 12px; font-size: 0.85rem; line-height: 1.4;
}
.chat-msg.user .chat-bubble { background: var(--blue); color: #fff; border-radius: 12px 12px 3px 12px; }
.chat-msg.bot .chat-bubble { background: #f1f5f9; color: var(--text); border-radius: 12px 12px 12px 3px; }
#chat-input {
  width: 100%; padding: 10px 14px;
  border: none; border-top: 1px solid var(--border);
  font-family: 'DM Sans', sans-serif; font-size: 0.88rem;
  outline: none; border-radius: 0 0 16px 16px;
}

/* ─── RESULTS ─── */
#results { animation: fadeIn 0.4s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<header>
  <h1>🌍 Smart <span>Travel</span> Planner</h1>
  <p>AI-powered itineraries for your perfect trip</p>
</header>

<div class="container">

  <!-- INPUT FORM -->
  <div class="card">
    <div class="section-title"><span>✈️</span> Plan Your Trip</div>

    <div class="form-grid">
      <div class="field">
        <label>Destination</label>
        <input type="text" id="destination" placeholder="Goa, Pune, Paris, Bali…" oninput="clearErr('destination')">
        <div class="field-error" id="err-destination"></div>
      </div>
      <div class="field">
        <label>Number of Days</label>
        <input type="number" id="days" placeholder="e.g. 4" min="1" max="30" oninput="clearErr('days')">
        <div class="field-error" id="err-days"></div>
      </div>
      <div class="field">
        <label>Travel Type</label>
        <select id="travelType" onchange="clearErr('travelType')">
          <option value="">Select travel type…</option>
          <option value="solo">Solo</option>
          <option value="couple">Couple</option>
          <option value="friends">Friends</option>
          <option value="family">Family</option>
        </select>
        <div class="field-error" id="err-travelType"></div>
      </div>
      <div class="field">
        <label>Budget</label>
        <div class="budget-row">
          <button class="budget-btn" onclick="selectBudget('Low', this)">🎒 Low</button>
          <button class="budget-btn" onclick="selectBudget('Medium', this)">🏨 Medium</button>
          <button class="budget-btn" onclick="selectBudget('High', this)">🌟 High</button>
        </div>
        <div class="field-error" id="err-budget"></div>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="generateBtn" onclick="generateTrip()">✨ Generate Itinerary</button>
      <button class="btn btn-secondary" onclick="randomTrip()">🎲 Surprise Me</button>
      <button class="btn btn-ghost" onclick="resetForm()">↺ Reset</button>
    </div>
  </div>

  <div id="results"></div>

</div>

<!-- CHATBOT -->
<div id="chatbot">
  <div id="chat-toggle" onclick="toggleChat()">
    <span>🤖 Travel Assistant</span>
    <span class="chevron">▲</span>
  </div>
  <div id="chat-body">
    <div id="chat-messages"></div>
    <input id="chat-input" placeholder="Ask me anything about travel…" onkeypress="handleChat(event)">
  </div>
</div>

<script>
// ────────────────────────────────────────────────
// STATE
// ────────────────────────────────────────────────
let chosenBudget = "";
let lastTrip = null; // in-memory, no localStorage

// ────────────────────────────────────────────────
// FORM HELPERS
// ────────────────────────────────────────────────
function getValue(id) { return document.getElementById(id).value.trim(); }

function selectBudget(type, btn) {
  chosenBudget = type;
  document.querySelectorAll('.budget-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  clearErr('budget');
}

function clearErr(id) {
  const el = document.getElementById('err-' + id);
  if (el) el.textContent = '';
  const input = document.getElementById(id);
  if (input) input.classList.remove('error');
}

function showErr(id, msg) {
  const el = document.getElementById('err-' + id);
  if (el) el.textContent = msg;
  const input = document.getElementById(id);
  if (input) input.classList.add('error');
}

function validate() {
  let ok = true;
  const dest = getValue('destination');
  const days = parseInt(getValue('days'));
  const type = getValue('travelType');

  if (!dest) { showErr('destination', 'Please enter a destination'); ok = false; }
  if (!days || days <= 0 || days > 30) { showErr('days', 'Enter between 1–30 days'); ok = false; }
  if (!type) { showErr('travelType', 'Please select travel type'); ok = false; }
  if (!chosenBudget) { showErr('budget', 'Please select a budget'); ok = false; }
  return ok;
}

function resetForm() {
  document.getElementById('destination').value = '';
  document.getElementById('days').value = '';
  document.getElementById('travelType').value = '';
  document.getElementById('results').innerHTML = '';
  chosenBudget = '';
  lastTrip = null;
  document.querySelectorAll('.budget-btn').forEach(b => b.classList.remove('active'));
  ['destination','days','travelType','budget'].forEach(clearErr);
}

// ────────────────────────────────────────────────
// BUDGET COST BREAKDOWN
// ────────────────────────────────────────────────
function getCostHTML(days) {
  let stay, food, travel, activities;
  if (chosenBudget === 'Low') {
    stay = 700; food = 300; travel = 800; activities = 200;
  } else if (chosenBudget === 'Medium') {
    stay = 2000; food = 800; travel = 1500; activities = 600;
  } else {
    stay = 6000; food = 1800; travel = 3000; activities = 1500;
  }
  const total = days * (stay + food + activities) + travel;
  const fmt = n => '₹' + n.toLocaleString('en-IN');
  return `
  <div class="card">
    <div class="section-title"><span>💰</span> Estimated Budget</div>
    <div class="cost-grid">
      <div class="cost-item"><div class="cost-val">${fmt(stay * days)}</div><div class="cost-label">Accommodation (${days}N)</div></div>
      <div class="cost-item"><div class="cost-val">${fmt(food * days)}</div><div class="cost-label">Food & Drinks</div></div>
      <div class="cost-item"><div class="cost-val">${fmt(travel)}</div><div class="cost-label">Transport</div></div>
      <div class="cost-item"><div class="cost-val">${fmt(activities * days)}</div><div class="cost-label">Activities</div></div>
    </div>
    <div class="cost-total"><span class="label">Total Approximate Cost</span><span class="amount">${fmt(total)}</span></div>
  </div>`;
}

// ────────────────────────────────────────────────
// PLACES DATA & IMAGES
// ────────────────────────────────────────────────
const placesData = {
  goa: ["Baga Beach", "Fort Aguada", "Anjuna Market", "Dudhsagar Falls"],
  mumbai: ["Gateway of India", "Marine Drive", "Juhu Beach", "Chhatrapati Shivaji Maharaj Terminus"],
  delhi: ["Red Fort", "India Gate", "Qutub Minar", "Lotus Temple"],
  pune: ["Shaniwar Wada", "Sinhagad Fort", "Aga Khan Palace", "Shrimant Dagdusheth Halwai"],
  jaipur: ["Hawa Mahal", "Amber Fort", "City Palace", "Jal Mahal"],
  manali: ["Solang Valley", "Rohtang Pass", "Hadimba Temple", "Jana Gaon"],
  bangalore: ["Lalbagh Garden", "Cubbon Park", "Bangalore Palace", "Iskcon Bangalore"],
  kerala: ["Alleppey Backwaters", "Munnar Hills", "Varkala Beach", "Thekkady"],
  hyderabad: ["Charminar", "Golconda Fort", "Ramoji Film City", "Hussain Sagar"]
};

const placeImages = {
  "Baga Beach": "https://static.toiimg.com/thumb/59486326.cms?resizemode=75&width=1200&height=900",
  "Fort Aguada": "https://s7ap1.scene7.com/is/image/incredibleindia/fort-aguada-goa-11-musthead-hero?qlt=82&ts=1742184865719",
  "Anjuna Market": "https://cdn.abhibus.com/2024/06/Anjuna-Flea-Market-North-Goa.jpg",
  "Dudhsagar Falls": "https://img.avianexperiences.com/attractions/4401d94d-6be7-465f-9c45-3015eb569ca5",
  "Gateway of India": "https://images.unsplash.com/photo-1598434192043-71111c1b3f41?w=600&q=80",
  "Marine Drive": "https://images.unsplash.com/photo-1666843527155-14ec5f016802?w=600&q=80",
  "Juhu Beach": "https://images.unsplash.com/photo-1710144481132-b1702639d4e7?w=600&q=80",
  "Chhatrapati Shivaji Maharaj Terminus": "https://images.unsplash.com/photo-1601961405399-801fb1f34581?w=600&q=80",
  "Red Fort": "https://images.unsplash.com/photo-1547300848-441153a7bf02?w=600&q=80",
  "India Gate": "https://images.unsplash.com/photo-1587474260584-136574528ed5?w=600&q=80",
  "Qutub Minar": "https://images.unsplash.com/photo-1632426237957-5ea14aae7100?w=600&q=80",
  "Lotus Temple": "https://images.unsplash.com/photo-1688257609244-3f2a893f19d6?w=600&q=80",
  "Shaniwar Wada": "https://images.unsplash.com/photo-1715678710159-ee67d5bdba85?w=600&q=80",
  "Sinhagad Fort": "https://images.unsplash.com/photo-1697144464658-bfe6a875f427?w=600&q=80",

async function fetchWeather(dest) {
  const key = dest.toLowerCase();
  let coords = cityCoords[key];
  if (!coords) {
    // Try geocoding via Open-Meteo's geocoding API
    try {
      const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(dest)}&count=1&language=en&format=json`);
      const geoData = await geoRes.json();
      if (geoData.results && geoData.results.length > 0) {
        coords = { lat: geoData.results[0].latitude, lon: geoData.results[0].longitude };
      } else return null;
    } catch { return null; }
  }
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code,apparent_temperature&timezone=auto`;
    const res = await fetch(url);
    const data = await res.json();
    const c = data.current;
    return {
      temp: Math.round(c.temperature_2m),
      feels: Math.round(c.apparent_temperature),
      humidity: c.relative_humidity_2m,
      wind: Math.round(c.wind_speed_10m),
      code: c.weather_code
    };
  } catch { return null; }
}

function buildWeatherHTML(dest, w) {
  if (!w) return '';
  const [icon, desc] = wmoCodes[w.code] || ['🌡️', 'Unknown'];
  const tip = packingTips[w.code] || '';
  return `<div class="weather-card">
    <div class="weather-main">
      <div class="weather-icon">${icon}</div>
      <div class="weather-temp">${w.temp}°C</div>
      <div class="weather-desc">${desc}</div>
      <div class="weather-location">📍 ${dest} — Current Weather</div>
    </div>
    <div class="weather-details">
      <div class="weather-row"><span>Feels like</span><span>${w.feels}°C</span></div>
      <div class="weather-row"><span>Humidity</span><span>${w.humidity}%</span></div>
      <div class="weather-row"><span>Wind</span><span>${w.wind} km/h</span></div>
    </div>
    ${tip ? `<div class="weather-tip">🧳 Packing tip: ${tip}</div>` : ''}
  </div>`;
}

// ────────────────────────────────────────────────
// CLAUDE API — SMART ITINERARY
// ────────────────────────────────────────────────
async function fetchAIItinerary(dest, days, travelType, budget) {
  const places = (placesData[dest.toLowerCase()] || []).join(', ') || 'key local attractions';
  const prompt = `You are an expert travel planner. Create a detailed ${days}-day itinerary for ${dest} for a ${travelType} trip on a ${budget} budget.

Key places in this destination: ${places}

Rules:
- Write exactly ${days} day sections
- Each day: Morning / Afternoon / Evening activities with specific places
- Include local food recommendations for each day
- Mention accommodation type appropriate for ${budget} budget
- Add one unique local tip per day
- Keep each day under 120 words
- Format: start each day with "Day N - [Theme]:" on its own line
- Be specific, vivid, and practical`;

  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      messages: [{ role: 'user', content: prompt }]
    })
  });
  const data = await response.json();
  const text = data.content?.map(b => b.text || '').join('') || '';
  return text;
}

function parseItinerary(text) {
  const parts = text.split(/(?=Day\s+\d+\s*[-–—:])/i).filter(p => p.trim());
  if (parts.length === 0) {
    return `<div class="day-content"><p>${text}</p></div>`;
  }
  return parts.map(part => {
    const headerMatch = part.match(/^Day\s+(\d+)\s*[-–—:]\s*([^\n]*)/i);
    if (!headerMatch) return `<div class="day-block"><p>${part.trim()}</p></div>`;
    const dayNum = headerMatch[1];
    const theme = headerMatch[2].trim();
    const body = part.replace(headerMatch[0], '').trim();
    const lines = body.split('\n').filter(l => l.trim()).map(l => {
      let line = l.trim();
      line = line.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      line = line.replace(/\*(.*?)\*/g, '<em>$1</em>');
      return `<p>${line}</p>`;
    }).join('');
    return `<div class="day-block">
      <div class="day-header">
        <span class="day-badge">Day ${dayNum}</span> ${theme}
      </div>
      <div class="day-content">${lines}</div>
    </div>`;
  }).join('');
}

async function generateTrip() {
  if (!validate()) return;

  const dest = getValue('destination');
  const days = parseInt(getValue('days'));
  const travelType = getValue('travelType');
  const budget = chosenBudget;

  const btn = document.getElementById('generateBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Generating…';

  const results = document.getElementById('results');
  results.innerHTML = `<div class="card"><div class="loader-wrap"><div class="loader"></div><div class="loader-text">Fetching weather & crafting your AI itinerary…</div></div></div>`;

  try {
    const [weatherData, aiText] = await Promise.all([
      fetchWeather(dest),
      fetchAIItinerary(dest, days, travelType, budget)
    ]);
    const weatherCode = weatherData?.code ?? -1;
    const tripHeader = '<div class="trip-header"><div class="trip-title">📍 ' + dest + '</div><div class="trip-meta"><span class="trip-tag">📅 ' + days + ' Day' + (days > 1 ? 's' : '') + '</span><span class="trip-tag">' + travelType.charAt(0).toUpperCase() + travelType.slice(1) + '</span><span class="trip-tag">' + budget + ' Budget</span></div></div>';
    const weatherHTML = buildWeatherHTML(dest, weatherData);
    const itineraryHTML = '<div class="card"><div class="section-title"><span>🗺️</span> AI-Powered Itinerary</div><div class="ai-status"><div class="ai-dot"></div> Generated by Claude AI — personalised for your trip</div>' + parseItinerary(aiText) + '</div>';
    results.innerHTML = [tripHeader, weatherHTML, getCostHTML(days), itineraryHTML, getPlacesHTML(dest), getPackingHTML(dest, days, travelType, budget, weatherCode), getBookingHTML(), getMapHTML(dest)].join('');
    lastTrip = { dest, days, travelType, budget };
    results.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (err) {
    results.innerHTML = '<div class="card" style="border-color:#ef4444;"><div class="section-title" style="color:#ef4444;"><span>⚠️</span> Something went wrong</div><p style="color:#64748b;font-size:0.93rem;">Could not generate itinerary. Check your connection and try again.</p></div>';
  } finally {
    btn.disabled = false;
    btn.textContent = '✨ Generate Itinerary';
  }
}

// ────────────────────────────────────────────────
// CHATBOT (Claude API powered)
// ────────────────────────────────────────────────
function toggleChat() {
  document.getElementById('chatbot').classList.toggle('open');
}

function handleChat(e) { if (e.key === 'Enter') sendChat(); }

function addChat(text, type) {
  const msgs = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = `chat-msg ${type}`;
  div.innerHTML = `<div class="chat-bubble">${text}</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

let chatHistory = [];

async function sendChat() {
  const input = document.getElementById('chat-input');
  const msg = input.value.trim();
  if (!msg) return;

  addChat(msg, 'user');
  input.value = '';

  const tripContext = lastTrip
    ? `The user currently has a ${lastTrip.days}-day ${lastTrip.travelType} trip to ${lastTrip.dest} planned on a ${lastTrip.budget} budget.`
    : 'No trip has been generated yet.';

  chatHistory.push({ role: 'user', content: msg });

  const systemPrompt = `You are a friendly, expert travel assistant for an Indian travel planning app. ${tripContext} Answer travel questions helpfully and concisely (under 80 words). If the user asks to generate a trip, tell them to fill the form above.`;

  // Add typing indicator with unique id
  const typingId = 'typing-' + Date.now();
  const msgs = document.getElementById('chat-messages');
  const typingDiv = document.createElement('div');
  typingDiv.className = 'chat-msg bot';
  typingDiv.id = typingId;
  typingDiv.innerHTML = '<div class="chat-bubble">…</div>';
  msgs.appendChild(typingDiv);
  msgs.scrollTop = msgs.scrollHeight;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: systemPrompt,
        messages: chatHistory
      })
    });
    const data = await response.json();
    if (data.error) throw new Error(data.error.message);
    const reply = data.content?.map(b => b.text || '').join('') || "Sorry, I couldn't respond right now.";
    chatHistory.push({ role: 'assistant', content: reply });
    const typing = document.getElementById(typingId);
    if (typing) typing.remove();
    addChat(reply, 'bot');
  } catch (e) {
    const typing = document.getElementById(typingId);
    if (typing) typing.remove();
    addChat("Sorry, something went wrong. Please try again!", 'bot');
  }
}
